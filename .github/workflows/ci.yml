name: Tanavi CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Build Check
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://tanavibydeepika.com
          NEXT_PUBLIC_SUPABASE_URL: https://wnbckffbhhmxxjbetzvs.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_nc4EgAvRw9x3jQIYXQ1-Jw_BBfHGSC8
          SUPABASE_SERVICE_ROLE_KEY: sb_publishable_nc4EgAvRw9x3jQIYXQ1-Jw_BBfHGSC8
          RAZORPAY_KEY_ID: rzp_test_key
          RAZORPAY_KEY_SECRET: test_secret

      - name: Deploy to Hostinger VPS
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -n "${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}" ]; then
            echo "Triggering Hostinger VPS Auto-deploy Webhook..."
            curl -s -X POST "${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}"
          else
            echo "HOSTINGER_DEPLOY_WEBHOOK secret not configured yet."
          fi
